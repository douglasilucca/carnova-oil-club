{% extends "base.html" %}
{% block title %}Edit {{ member.member_id }}{% endblock %}
{% block content %}
<div class="page-heading"><div><a class="back" href="{{ url_for('member_detail', member_id=member.member_id) }}">← Member</a><h1>Edit {{ member.name }}</h1></div></div>
<section class="panel form-panel">
<form method="post" class="form-grid">
  <label>Full name<input name="name" value="{{ member.name }}" required></label>
  <label>Email<input type="email" name="email" value="{{ member.email }}" required></label>
  <label>Phone<input name="phone" value="{{ member.phone }}"></label>
  <label>Expiration date<input type="date" name="expiration_date" value="{{ member.expiration_date.isoformat() }}" required></label>
  <label>Total oil changes<input type="number" min="1" name="total_changes" value="{{ member.total_changes }}" required></label>
  <label>Remaining changes<input type="number" min="0" name="remaining_changes" value="{{ member.remaining_changes }}" required></label>
  <label>Status<select name="status">{% for value in ['active','completed','expired','cancelled'] %}<option value="{{ value }}" {% if member.status == value %}selected{% endif %}>{{ value|title }}</option>{% endfor %}</select></label>
  <div class="wide actions"><button class="button primary">Save Changes</button><a class="button ghost" href="{{ url_for('member_detail', member_id=member.member_id) }}">Cancel</a></div>
</form>
</section>
{% endblock %}
