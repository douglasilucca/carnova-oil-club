<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title or "Carnova Oil Club" }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body>{% if session.get('admin_id') %}<nav><a href="{{ url_for('dashboard') }}"><b>CARNOVA <span>OIL CLUB</span></b></a>
<div><a class="button" href="{{ url_for('export_members') }}">Export CSV</a> <a class="button primary" href="{{ url_for('new_member') }}">+ New Member</a> <a class="button" href="{{ url_for('logout') }}">Logout</a></div></nav>{% endif %}
<main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main></body></html>
