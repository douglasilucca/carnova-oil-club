{% extends "base.html" %}
{% block title %}My Sales Link | Carnova Oil Club{% endblock %}
{% block content %}
<section class="login-card">
  <p class="eyebrow gold">CARNOVA OIL CLUB</p>
  <h1>Carnova Card</h1>
  <p class="muted">Sales Representative: {{ rep.name }}</p>
  <p class="referral-url">{{ referral_url }}</p>
  <div class="stack">
    <button class="button primary" type="button" onclick="carnovaCopyReferralLink('{{ referral_url }}')">Copy My Link</button>
    <button class="button secondary" type="button" onclick="carnovaShareReferralLink('{{ referral_url }}')">Share My Link</button>
  </div>
  <p id="sales-link-feedback" class="feedback" aria-live="polite"></p>
</section>
<script src="{{ url_for('static', filename='sales-link.js') }}"></script>
{% endblock %}
