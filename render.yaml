services:
  - type: web
    name: carnova-oil-club
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@carnovaoil.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APPOINTMENT_REMINDER_MORNING_HOUR
        value: "8"
      - key: APPOINTMENT_REMINDER_TIMEZONE
        value: America/New_York
      - key: DATABASE_URL
        fromDatabase:
          name: carnova-oil-club-db
          property: connectionString

  - type: cron
    name: carnova-oil-club-reminders
    runtime: python
    schedule: "5 12,13 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_reminders.py
    envVars:
      - key: BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: APPOINTMENT_REMINDER_MORNING_HOUR
        value: "8"
      - key: APPOINTMENT_REMINDER_TIMEZONE
        value: America/New_York
      - key: DATABASE_URL
        fromDatabase:
          name: carnova-oil-club-db
          property: connectionString

databases:
  - name: carnova-oil-club-db
    databaseName: carnova_oil_club
    user: carnova_oil_club
